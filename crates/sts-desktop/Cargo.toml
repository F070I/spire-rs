[package]
name = "sts-desktop"
version.workspace = true
edition.workspace = true
description = "Slay the Spire (text edition) - desktop window UI (egui/glow)"

[[bin]]
name = "sts-desktop"
path = "src/main.rs"

[dependencies]
sts-core = { path = "../sts-core" }
sts-interface = { path = "../sts-interface" }
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
