[workspace]
resolver = "2"
members = [
    "crates/sts-data",
    "crates/sts-core",
    "crates/sts-interface",
    "crates/sts-terminal",
    "crates/sts-desktop",
    "crates/sts-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
