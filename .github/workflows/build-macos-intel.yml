name: Build Intel macOS Screen Saver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-intel:
    # GitHub 官方提供的 Intel x86_64 macOS 构建机；与你 Mac 上安装 Xcode 无关。
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: Build .saver for Intel macOS 12+
        shell: bash
        run: bash ./build-intel.sh 2>&1 | tee build-intel.log

      - name: Push build log to build-logs branch on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add build-intel.log
          git commit -m "ci: attach build-intel.log for failure diagnostics [skip ci]"
          git push --force origin "HEAD:refs/heads/build-logs"

      - name: Upload .saver download
        uses: actions/upload-artifact@v4
        with:
          name: AutoSnakeSaver-v21-Intel-macOS12
          path: dist/AutoSnakeSaverIntel-macOS12-Intel.zip
          if-no-files-found: error
          retention-days: 30
