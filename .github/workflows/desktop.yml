name: desktop

# 桌面 UI 测试构建（不触发正式 Release——UI 待用户验证后再打新 tag）
on:
  push:
    branches: [main]
    paths:
      - "crates/sts-desktop/**"
      - "crates/sts-interface/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-desktop
            os: windows-latest
            target: x86_64-pc-windows-gnu
            deploy: ""
            bin: sts-desktop.exe
          - name: macos-intel-desktop
            os: macos-15-intel
            target: x86_64-apple-darwin
            deploy: "12.0"
            bin: sts-desktop
          - name: macos-arm64-desktop
            os: macos-latest
            target: aarch64-apple-darwin
            deploy: "12.0"
            bin: sts-desktop
          - name: linux-x64-desktop
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            deploy: ""
            bin: sts-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Pin deployment target (macOS 12)
        if: matrix.deploy != ''
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.deploy }}" >> "$GITHUB_ENV"

      - name: Install mingw-w64 (windows-gnu)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install mingw -y --no-progress

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-desktop-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release -p sts-desktop --target ${{ matrix.target }}

      - name: Smoke (--version)
        shell: bash
        run: "target/${{ matrix.target }}/release/${{ matrix.bin }} --version"

      # macOS：最低部署目标机器验证 + .app 打包
      - name: Verify macOS 12 minos & bundle .app
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/sts-desktop"
          minos=$(otool -l "$BIN" | awk '/cmd LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "binary minos=$minos (expected ${{ matrix.deploy }})"
          test "$minos" = "${{ matrix.deploy }}" || {
            echo "ERROR: min version $minos != ${{ matrix.deploy }}"; exit 1; }
          app="Spire.app/Contents/MacOS"
          mkdir -p "$app/Resources"
          cp "$BIN" "$app/sts-desktop"
          cat > Spire.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>spire-rs</string>
            <key>CFBundleExecutable</key><string>sts-desktop</string>
            <key>CFBundleIdentifier</key><string>io.github.f070i.spirers</string>
            <key>CFBundleShortVersionString</key><string>0.1.1-desktop-test</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          tar -czf spire-macos-${{ matrix.target }}.app.tar.gz Spire.app

      - name: Package (zip)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-*) out="sts-desktop-windows-x64.zip"; exe="sts-desktop.exe"; exe2="sts.exe" ;;
            macos-*)   out="" ;;
            *)         out="sts-desktop-linux-x64.zip"; exe="sts-desktop" ;;
          esac
          if [ -n "$out" ]; then
            dir="spire-rs-desktop"
            mkdir -p "$dir"
            cp "target/${{ matrix.target }}/release/$exe" "$dir/"
            cp "target/release/sts.exe" "$dir/" 2>/dev/null || \
              cp "target/${{ matrix.target }}/release/sts.exe" "$dir/" 2>/dev/null || true
            cp README.md "$dir/" 2>/dev/null || true
            if command -v 7z >/dev/null; then 7z a "$out" "$dir"; else zip -r "$out" "$dir"; fi
            sha256sum "$out" > "$out.sha256" || shasum -a 256 "$out" > "$out.sha256"
          fi

      - name: Package (windows zip with sha)
        if: runner.os == 'Windows'
        shell: bash
        run: sha256sum sts-desktop-windows-x64.zip > sts-desktop-windows-x64.zip.sha256 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            sts-desktop-*.zip
            sts-desktop-*.zip.sha256
            spire-macos-*.app.tar.gz
