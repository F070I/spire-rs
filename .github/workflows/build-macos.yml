name: Build independent macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and static tests (mock API, no real account)
        run: |
          PYTHONPATH=core python -m unittest tests.test_standalone tests.test_web_auth tests.test_signin.TestCatchUp tests.test_signin.TestMultiAccount tests.test_signin.TestLocking -v
          bash -n backend/install_launchd.sh backend/uninstall_launchd.sh backend/migrate_data.sh

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller>=6,<7' certifi
      - name: Freeze Python backend (no Python needed on users' Macs)
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name YujiaService \
            --paths core --hidden-import=certifi --collect-data certifi \
            core/service_entry.py
      - name: Build native Cocoa and WebKit window, assemble app
        run: |
          set -euo pipefail
          APP='output/寓+签到.app'
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/backend" \
                   "$APP/Contents/Resources/runtime"
          cp src/Info.plist "$APP/Contents/Info.plist"
          cp assets/AppIcon.icns assets/AppIcon.png "$APP/Contents/Resources/"
          cp backend/*.sh "$APP/Contents/Resources/backend/"
          chmod 755 "$APP/Contents/Resources/backend/"*.sh
          cp -R dist/YujiaService "$APP/Contents/Resources/runtime/YujiaService"
          clang -fobjc-arc -fmodules -mmacosx-version-min=12.0 \
            -framework Cocoa -framework WebKit -framework Foundation \
            src/main.m -o "$APP/Contents/MacOS/YujiaApp"
          chmod 755 "$APP/Contents/MacOS/YujiaApp"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
      - name: Smoke test the embedded runtime and HTTP management panel
        run: |
          set -euo pipefail
          SVC='output/寓+签到.app/Contents/Resources/runtime/YujiaService/YujiaService'
          export YUJIA_CONFIG_DIR="$RUNNER_TEMP/yujia-signin-smoke"
          export YUJIA_WEB_PORT=18765
          "$SVC" --check
          "$SVC" --panel > "$RUNNER_TEMP/yujia-web-test.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/api/health | grep -q 'yujia-panel'; then
              echo 'Frozen service HTTP health: PASS'
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/yujia-web-test.log"
          exit 1
      - name: Pack single draggable app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent 'output/寓+签到.app' \
            'artifacts/寓+签到-macOS-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: YujiaSignIn-macOS-${{ matrix.arch }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
