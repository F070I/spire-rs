name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-gnu
            bin: sts.exe
            archive: sts-windows-x86_64.zip
          - name: macOS-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            deploy: "12.0"
            bin: sts
            archive: sts-macos-x86_64.zip
          - name: macOS-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            deploy: "12.0"
            bin: sts
            archive: sts-macos-aarch64.zip
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: sts
            archive: sts-linux-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # macOS：显式钉最低部署版本——Apple 链接器默认取构建机系统版本，
      # 不钉会导致产物要求 runner 的系统（如 15.x）而在旧系统拒启
      - name: Pin deployment target (macOS)
        if: startsWith(matrix.os, 'macos')
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.deploy }}" >> "$GITHUB_ENV"

      # Windows 用 GNU 目标（本仓库零依赖，gnu 工具链即可；避免 MSVC link 环境差异）
      - name: Install mingw-w64 (windows-gnu)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install mingw -y --no-progress

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test (workspace)
        run: cargo test --workspace --release

      - name: Build (release)
        run: cargo build --release -p sts-terminal --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          printf 'q\n' | "target/${{ matrix.target }}/release/${{ matrix.bin }}" >/dev/null 2>&1 || true

      # macOS：机器验证兼容性（不做口头承诺）
      # 1) rustc 对该目标的默认部署版本记入日志供核查
      # 2) 产物 LC_BUILD_VERSION.minos 必须恰为部署目标
      # 3) 链接库白名单：仅 libSystem/libgcc_s（零依赖断言）
      - name: Verify macOS 12 compatibility
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          echo "rustc default deployment target:"
          rustc --print deployment-target --target ${{ matrix.target }} || true
          minos=$(otool -l "$BIN" | awk '/cmd LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "binary minos=$minos (expected ${{ matrix.deploy }})"
          test "$minos" = "${{ matrix.deploy }}" || {
            echo "ERROR: minimum OS version is $minos, expected ${{ matrix.deploy }}"; exit 1; }
          echo "--- linked libraries ---"
          otool -L "$BIN"
          if otool -L "$BIN" | tail -n +2 | grep -vE "/usr/lib/libSystem|/usr/lib/libgcc_s"; then
            echo "ERROR: unexpected linked library (breaks zero-dep macOS 12 claim)"; exit 1
          fi
          echo "OK: minos ${{ matrix.deploy }}, linked libs whitelisted"

      - name: Package
        shell: bash
        run: |
          dir="sts-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$dir/"
          cp README.md "$dir/" 2>/dev/null || true
          cp LICENSE-MIT "$dir/" 2>/dev/null || cp LICENSE "$dir/" 2>/dev/null || true
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            if command -v 7z >/dev/null; then
              7z a "${{ matrix.archive }}" "$dir"
            else
              zip -r "${{ matrix.archive }}" "$dir"
            fi
          fi
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256" || shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.sha256
          generate_release_notes: true
